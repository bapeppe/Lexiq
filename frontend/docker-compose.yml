services:
  frontend:
    pull_policy: build
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: mern-frontend
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=${API_URL:-http://100.96.72.20:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
