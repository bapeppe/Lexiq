<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111514" />
    <meta
      name="description"
      content="Impara nuove parole inglesi ogni giorno, con spiegazioni in italiano, ripassi a intervalli e un vocabolario personale."
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("lexiq-theme") || "dark";
      } catch {}
    </script>
    <title>Lexiq — Un piccolo progresso, ogni giorno</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
