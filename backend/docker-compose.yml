services:
  backend:
    build: .
    pull_policy: build
    container_name: mern-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - MONGO_URI=mongodb://100.96.72.20:27017/lexiq_db
      - NODE_ENV=production
      - PORT=5000
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
    networks:
      - default
      - mongodb

networks:
  mongodb:
    external: true
    name: ${MONGODB_NETWORK:-mern-database_default}
