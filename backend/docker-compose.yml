version: '3.8'

services:
  backend:
    build: .
    container_name: mern-backend
    restart: unless-stopped
    ports:
      # Modifica 5000 se il tuo server Express usa una porta diversa
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      # Questa variabile verrà iniettata da Portainer per sicurezza
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGO_URI=${MONGO_URI:-}
      - NODE_ENV=production
      - PORT=5000
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
